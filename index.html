<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPC Scanner — Metro1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
  /* ============================================================
     CONFIG — fill these two in once (see setup steps from Claude).
     Everything else (site, lists, columns) is auto-discovered.
     ============================================================ */
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --txt:#e6edf3; --dim:#8b97a6; --amber:#ffbf00;
    --add:#2ea043; --remove:#f85149; --blue:#2f81f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(47,129,247,.08), transparent 60%),
      var(--bg);
    color:var(--txt); font-family:'IBM Plex Sans',sans-serif; font-size:15px;
  }
  .mono{font-family:'IBM Plex Mono',monospace}
  /* ---- gate (sign-in / loading) ---- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:var(--bg);z-index:50;text-align:center;padding:24px}
  #gate h1{font-weight:700;letter-spacing:-.5px;margin:0;font-size:28px}
  #gate p{color:var(--dim);margin:0;max-width:440px;line-height:1.5}
  .btn{font:600 15px 'IBM Plex Sans';background:var(--blue);color:#fff;border:0;
    padding:12px 22px;border-radius:10px;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .err{color:var(--remove);max-width:560px;font-size:13px;line-height:1.5}
  /* ---- app shell ---- */
  #app{display:none;height:100vh;flex-direction:column;padding:14px 18px;gap:12px}
  header{display:flex;align-items:center;gap:14px}
  header .title{font-weight:700;font-size:18px;letter-spacing:-.3px}
  header .who{margin-left:auto;color:var(--dim);font-size:12px;display:flex;gap:10px;align-items:center}
  /* scan row */
  .scanwrap{position:relative}
  #scan{width:100%;font:600 30px 'IBM Plex Mono';color:var(--txt);background:var(--panel);
    border:4px solid var(--amber);border-radius:16px;padding:16px 20px;outline:none}
  #scan::placeholder{color:#5b6675;font-weight:500}
  /* status strip */
  .strip{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.4fr;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:74px}
  .card .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .card .v{font-weight:700;font-size:22px;margin-top:4px;line-height:1.1}
  #modeCard{transition:background .15s} 
  #modeCard.add{background:var(--add);border-color:transparent}
  #modeCard.remove{background:var(--remove);border-color:transparent}
  #modeCard.add .k,#modeCard.remove .k{color:rgba(255,255,255,.85)}
  #modeCard.add .v,#modeCard.remove .v{color:#fff}
  /* on-hand callout */
  #onhand{background:var(--panel2);border:1px solid var(--line)}
  #onhand .v{color:var(--amber);font-size:26px}
  #onhand .sub{color:var(--dim);font-size:12px;margin-top:2px;font-family:'IBM Plex Mono'}
  /* main two-column */
  .grid{display:grid;grid-template-columns:380px 1fr;gap:14px;flex:1;min-height:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;
    flex-direction:column;min-height:0;overflow:hidden}
  .pane h2{margin:0;padding:12px 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .pane h2 .count{margin-left:auto;color:var(--txt);font-weight:600}
  #search{margin:10px 16px;width:calc(100% - 32px);font:500 14px 'IBM Plex Sans';
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 12px;outline:none}
  .list{overflow:auto;flex:1}
  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono';font-size:13px}
  th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:600;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
  td{padding:8px 12px;border-bottom:1px solid rgba(42,50,61,.5)}
  tr:hover td{background:var(--panel2)}
  td.num{text-align:right;color:var(--amber);font-weight:600}
  .empty{color:#5b6675;padding:24px 16px;text-align:center;font-style:italic}
  .pulse{animation:pulse .5s ease}
  @keyframes pulse{0%{background:rgba(255,191,0,.25)}100%{background:transparent}}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;
    transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <h1>UPC Scanner</h1>
  <p id="gateMsg">Sign in with your Metro1 account to start scanning.</p>
  <button class="btn" id="signin">Sign in</button>
  <div class="err" id="gateErr"></div>
</div>

<div id="app">
  <header>
    <div class="title mono">📦 UPC&nbsp;SCANNER</div>
    <div class="who">
      <span id="userName"></span>
      <button class="btn ghost" id="signout" style="padding:6px 12px;font-size:12px">Sign out</button>
    </div>
  </header>

  <div class="scanwrap">
    <input id="scan" autocomplete="off" spellcheck="false"
           placeholder="Scan BOX / ADD / REMOVE / UPC">
  </div>

  <div class="strip">
    <div class="card">
      <div class="k">Active Box</div>
      <div class="v mono" id="boxVal">(none)</div>
    </div>
    <div class="card" id="modeCard">
      <div class="k">Mode</div>
      <div class="v" id="modeVal">ADD</div>
    </div>
    <div class="card">
      <div class="k">Box Total</div>
      <div class="v mono" id="boxTotal">0 ea</div>
    </div>
    <div class="card" id="onhand">
      <div class="k">On Hand — Last Item (all boxes)</div>
      <div class="v mono" id="onhandVal">—</div>
      <div class="sub" id="onhandSub">scan an item to see total on hand</div>
    </div>
  </div>

  <div style="font-size:13px;color:var(--dim)" id="status">Scan a BOX to start.</div>

  <div class="grid">
    <div class="pane">
      <h2>Search Inventory <span class="count" id="searchCount"></span></h2>
      <input id="search" placeholder="Search UPC / Style / Description…" autocomplete="off">
      <div class="list">
        <table>
          <thead><tr><th>Box</th><th>Style</th><th>UPC</th><th style="text-align:right">Qty</th></tr></thead>
          <tbody id="searchBody"></tbody>
        </table>
      </div>
    </div>

    <div class="pane">
      <h2>Active Box Contents <span class="count" id="boxCount"></span></h2>
      <div class="list">
        <table>
          <thead><tr><th>Style</th><th>Description</th><th>UPC</th><th style="text-align:right">Qty</th><th>Last Scan</th></tr></thead>
          <tbody id="boxBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1) CONFIG  — set CLIENT_ID and TENANT_ID once.
   ============================================================ */
const CONFIG = {
  CLIENT_ID: "cedd84ab-e711-4dcb-bd43-a3c1ef65e6d1",
  TENANT_ID: "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  SITE_HOSTNAME: "met1sol.sharepoint.com",
  SITE_PATH: "/sites/Production",
  INVENTORY_LIST: "Sample Inventory",            // display name
  MASTER_LIST: "UPC_MASTER",                      // display name
  // Display names of the columns we use; internal names are auto-discovered.
  COLS: { BoxID:"BoxID", UPC:"UPC", Style:"Style", Description:"Description", Qty:"Qty", LastScanTime:"LastScanTime" }
};
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = ["Sites.ReadWrite.All"];   // delegated: access is bounded by each user's own SharePoint permissions

/* ============================================================
   2) AUTH (MSAL)
   ============================================================ */
let msalApp = null;
let account = null;

async function ensureMsal() {
  if (msalApp) return msalApp;
  if (!window.msal || !window.msal.PublicClientApplication) {
    throw new Error("Microsoft sign-in library didn't load — your network may be blocking alcdn.msauth.net. Try a different network, or tell me and I'll swap the CDN.");
  }
  msalApp = new window.msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: "https://login.microsoftonline.com/" + CONFIG.TENANT_ID,
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: "sessionStorage" }
  });
  // MSAL v3 requires initialize() before use; v2 has no such method.
  if (typeof msalApp.initialize === "function") await msalApp.initialize();
  return msalApp;
}

async function getToken() {
  const req = { scopes: SCOPES, account };
  try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch (e) { return (await msalApp.acquireTokenPopup(req)).accessToken; }
}

async function gfetch(url, opts={}) {
  const token = await getToken();
  const res = await fetch(url, {
    ...opts,
    headers: { Authorization:"Bearer "+token, "Content-Type":"application/json", ...(opts.headers||{}) }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(res.status + " " + res.statusText + " — " + body.slice(0,300));
  }
  return res.status === 204 ? null : res.json();
}

/* ============================================================
   3) STATE
   ============================================================ */
const S = {
  siteId:null, invListId:null, masterListId:null,
  invMap:{}, masterMap:{},          // displayName -> internal name
  master:new Map(),                 // UPC -> {style, description}
  inventory:[],                     // [{id, BoxID, UPC, Style, Description, Qty, LastScanTime}]
  box:"", mode:"ADD"
};

/* ============================================================
   4) AUTO-DISCOVERY (site, lists, column internal names) + initial load
   ============================================================ */
async function discover() {
  const site = await gfetch(`${GRAPH}/sites/${CONFIG.SITE_HOSTNAME}:${CONFIG.SITE_PATH}`);
  S.siteId = site.id;

  const lists = await gfetch(`${GRAPH}/sites/${S.siteId}/lists?$select=id,displayName,name&$top=200`);
  const find = n => (lists.value.find(l => l.displayName === n) || lists.value.find(l => l.name === n));
  const inv = find(CONFIG.INVENTORY_LIST), mas = find(CONFIG.MASTER_LIST);
  if (!inv) throw new Error(`List "${CONFIG.INVENTORY_LIST}" not found on the site.`);
  if (!mas) throw new Error(`List "${CONFIG.MASTER_LIST}" not found on the site.`);
  S.invListId = inv.id; S.masterListId = mas.id;

  S.invMap   = await colMap(S.invListId);
  S.masterMap = await colMap(S.masterListId);

  await Promise.all([loadMaster(), loadInventory()]);
}

async function colMap(listId) {
  const cols = await gfetch(`${GRAPH}/sites/${S.siteId}/lists/${listId}/columns?$select=name,displayName`);
  const m = {};
  for (const c of cols.value) m[c.displayName] = c.name;        // display -> internal
  // ensure our known display names resolve; fall back to identical internal name if present
  for (const d of Object.values(CONFIG.COLS)) {
    if (!m[d] && cols.value.some(c => c.name === d)) m[d] = d;
  }
  return m;
}

async function pageAll(url) {
  const out = [];
  let next = url;
  while (next) { const j = await gfetch(next); out.push(...(j.value||[])); next = j["@odata.nextLink"]; }
  return out;
}

async function loadMaster() {
  const im = S.masterMap;
  const rows = await pageAll(`${GRAPH}/sites/${S.siteId}/lists/${S.masterListId}/items?expand=fields&$top=200`);
  S.master.clear();
  for (const r of rows) {
    const f = r.fields;
    const upc = (f[im[CONFIG.COLS.UPC]] ?? "").toString().toUpperCase().trim();
    if (upc) S.master.set(upc, { style: f[im[CONFIG.COLS.Style]] ?? "", description: f[im[CONFIG.COLS.Description]] ?? "" });
  }
}

async function loadInventory() {
  const im = S.invMap;
  const rows = await pageAll(`${GRAPH}/sites/${S.siteId}/lists/${S.invListId}/items?expand=fields&$top=200`);
  S.inventory = rows.map(r => ({
    id: r.id,
    BoxID: r.fields[im[CONFIG.COLS.BoxID]] ?? "",
    UPC: (r.fields[im[CONFIG.COLS.UPC]] ?? "").toString(),
    Style: r.fields[im[CONFIG.COLS.Style]] ?? "",
    Description: r.fields[im[CONFIG.COLS.Description]] ?? "",
    Qty: Number(r.fields[im[CONFIG.COLS.Qty]] ?? 0),
    LastScanTime: r.fields[im[CONFIG.COLS.LastScanTime]] ?? null
  }));
}

/* ============================================================
   5) GRAPH WRITES
   ============================================================ */
function fieldPayload(obj) {
  const im = S.invMap, out = {};
  for (const [disp, val] of Object.entries(obj)) out[im[CONFIG.COLS[disp]]] = val;
  return out;
}
async function createRow(obj) {
  const j = await gfetch(`${GRAPH}/sites/${S.siteId}/lists/${S.invListId}/items`,
    { method:"POST", body: JSON.stringify({ fields: fieldPayload(obj) }) });
  return j.id;
}
async function patchRow(id, obj) {
  await gfetch(`${GRAPH}/sites/${S.siteId}/lists/${S.invListId}/items/${id}/fields`,
    { method:"PATCH", body: JSON.stringify(fieldPayload(obj)) });
}
async function deleteRow(id) {
  await gfetch(`${GRAPH}/sites/${S.siteId}/lists/${S.invListId}/items/${id}`, { method:"DELETE" });
}

/* ============================================================
   6) SCAN LOGIC  (mirrors the Power App, plus on-hand total)
   ============================================================ */
const $ = id => document.getElementById(id);

function setMode(m){ S.mode=m; $("modeVal").textContent=m;
  $("modeCard").className = "card " + m.toLowerCase(); }
function setBox(b){ S.box=b; $("boxVal").textContent = b||"(none)"; }
function setStatus(t){ $("status").textContent = "Last action: " + t; }
function onHandFor(upc){ return S.inventory.filter(r=>r.UPC.toUpperCase()===upc).reduce((s,r)=>s+r.Qty,0); }

async function handleScan(raw) {
  const v = (raw||"").toUpperCase().trim();
  if (!v) return;

  if (v === "ADD")      { setMode("ADD");    setStatus("Mode set to ADD"); return render(); }
  if (v === "REMOVE")   { setMode("REMOVE"); setStatus("Mode set to REMOVE"); return render(); }
  if (v.slice(0,3) === "BOX") { setBox(v); setStatus("Active box: "+v); return render(); }

  // ---- UPC scan ----
  if (!S.box) { setStatus("Scan a BOX first."); return; }

  const upc = v;
  const mrec = S.master.get(upc);
  const style = mrec ? (mrec.style || "Unknown") : "Unknown";
  const desc  = mrec ? (mrec.description || "") : "UPC not found";
  const now = new Date().toISOString();

  const existing = S.inventory.find(r => r.BoxID === S.box && r.UPC.toUpperCase() === upc);

  try {
    if (S.mode === "ADD") {
      if (!existing) {
        const id = await createRow({ BoxID:S.box, UPC:upc, Style:style, Description:desc, Qty:1, LastScanTime:now });
        S.inventory.push({ id, BoxID:S.box, UPC:upc, Style:style, Description:desc, Qty:1, LastScanTime:now });
      } else {
        existing.Qty += 1; existing.Style=style; existing.Description=desc; existing.LastScanTime=now;
        await patchRow(existing.id, { Qty:existing.Qty, Style:style, Description:desc, LastScanTime:now });
      }
      setStatus("Added 1 → " + upc);
    } else { // REMOVE
      if (!existing) { setStatus("Not in box — nothing to remove."); }
      else if (existing.Qty <= 1) {
        await deleteRow(existing.id);
        S.inventory = S.inventory.filter(r => r.id !== existing.id);
        setStatus("Removed last one → row deleted");
      } else {
        existing.Qty -= 1; existing.LastScanTime=now;
        await patchRow(existing.id, { Qty:existing.Qty, LastScanTime:now });
        setStatus("Removed 1 → Qty now " + existing.Qty);
      }
    }
  } catch (e) {
    setStatus("ERROR — " + e.message);
    toast("Write failed: " + e.message);
    return render();
  }

  // ---- on-hand across ALL boxes for the scanned item ----
  const total = onHandFor(upc);
  $("onhandVal").textContent = total + " ea";
  $("onhandSub").textContent = `${upc} · ${style}` + (desc && desc!=="UPC not found" ? ` · ${desc}` : "");
  $("onhand").classList.remove("pulse"); void $("onhand").offsetWidth; $("onhand").classList.add("pulse");

  render();
}

/* ============================================================
   7) RENDER
   ============================================================ */
function fmtTime(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleString([], {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

function render() {
  // active box contents
  const rows = S.inventory.filter(r => r.BoxID === S.box).sort((a,b)=>a.UPC.localeCompare(b.UPC));
  $("boxBody").innerHTML = rows.length ? rows.map(r=>`
    <tr><td>${esc(r.Style)}</td><td>${esc(r.Description)}</td><td>${esc(r.UPC)}</td>
    <td class="num">${r.Qty}</td><td>${fmtTime(r.LastScanTime)}</td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">No items in this box yet.</td></tr>`;
  $("boxCount").textContent = rows.length ? rows.length+" lines" : "";
  $("boxTotal").textContent = rows.reduce((s,r)=>s+r.Qty,0) + " ea";

  renderSearch();
}

function renderSearch() {
  const q = $("search").value.toLowerCase().trim();
  if (!q) { $("searchBody").innerHTML = `<tr><td colspan="4" class="empty">Type to search all inventory.</td></tr>`; $("searchCount").textContent=""; return; }
  const hits = S.inventory.filter(r =>
    r.UPC.toLowerCase().includes(q) || (r.Style||"").toLowerCase().includes(q) || (r.Description||"").toLowerCase().includes(q)
  ).slice(0,300);
  $("searchBody").innerHTML = hits.length ? hits.map(r=>`
    <tr><td>${esc(r.BoxID)}</td><td>${esc(r.Style)}</td><td>${esc(r.UPC)}</td><td class="num">${r.Qty}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No matches.</td></tr>`;
  $("searchCount").textContent = hits.length ? hits.length+" found" : "";
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3500); }

/* ============================================================
   8) SCANNER INPUT — commit on Enter OR end-of-input timeout
   ============================================================ */
let scanTimer;
function wireScanner() {
  const el = $("scan");
  const commit = () => { const v = el.value; el.value=""; if(v.trim()) handleScan(v); el.focus(); };
  el.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); clearTimeout(scanTimer); commit(); }
  });
  // fallback for scanners not configured to send Enter: commit ~90ms after typing stops
  el.addEventListener("input", () => { clearTimeout(scanTimer); scanTimer = setTimeout(()=>{ if(el.value.trim()) commit(); }, 90); });
  // keep focus on the scan box (kiosk behaviour) unless user is in search
  document.addEventListener("click", e => { if (e.target.id !== "search") el.focus(); });
  el.focus();
  $("search").addEventListener("input", renderSearch);
}

/* ============================================================
   9) BOOT
   ============================================================ */
async function start() {
  $("gateMsg").textContent = "Setting up — discovering lists and loading inventory…";
  $("signin").style.display = "none";
  try {
    await discover();
    $("userName").textContent = account?.username || "";
    $("gate").style.display = "none";
    $("app").style.display = "flex";
    setMode("ADD"); setBox(""); setStatus("Scan a BOX to start.");
    wireScanner(); render();
  } catch (e) {
    $("gateErr").textContent = "Setup error: " + e.message;
    const b = $("signin"); b.style.display = "inline-block"; b.disabled = false; b.textContent = "Retry";
  }
}

async function init() {
  // Wire the button FIRST so it always responds, even if something below fails.
  const btn = $("signin");
  btn.onclick = async () => {
    $("gateErr").textContent = "";
    btn.disabled = true; const label = btn.textContent; btn.textContent = "Signing in…";
    try {
      await ensureMsal();
      if (!account) { const r = await msalApp.loginPopup({ scopes: SCOPES }); account = r.account; }
      await start();
    } catch (e) {
      $("gateErr").textContent = "Sign-in failed: " + (e.message || e);
      btn.disabled = false; btn.textContent = "Retry";
    }
  };
  $("signout").onclick = () => { try { msalApp && msalApp.logoutPopup(); } catch(e){} };

  if (CONFIG.CLIENT_ID.startsWith("PUT-")) {
    $("gateMsg").textContent = "";
    $("gateErr").textContent = "Not configured: set CLIENT_ID and TENANT_ID in the CONFIG block.";
    btn.style.display = "none";
    return;
  }

  // Try to restore an existing session silently; never let this block the button.
  try {
    await ensureMsal();
    await msalApp.handleRedirectPromise();
    account = msalApp.getAllAccounts()[0] || null;
    if (account) { btn.disabled = true; btn.textContent = "Signing in…"; await start(); }
  } catch (e) {
    $("gateErr").textContent = e.message || String(e);
  }
}
init();
</script>
</body>
</html>
